name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test main game rules
        run: node --test tests/*.test.mjs
      - name: Test Hermes service
        working-directory: hermes-hezhang
        run: npm test
      - name: Parse QQ gateway
        run: python -m py_compile hermes-hezhang/hezhang_gateway_qq.py
